<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tova</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: system-ui, -apple-system, sans-serif;
        }
        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9a9a8a;
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            gap: 1rem;
        }
        #loading .title {
            font-size: 2.5rem;
            color: #d4d0c8;
            letter-spacing: 0.3em;
        }
        #loading .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="title">TOVA</div>
        <div>loading<span class="dots"></span></div>
    </div>
    <link data-trunk rel="rust" data-wasm-opt="z" />
</body>
</html>
