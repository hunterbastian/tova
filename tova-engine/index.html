<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tova</title>
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="rust" data-bin="tova-engine" />
  </head>
  <body>
    <canvas id="tova-canvas"></canvas>

      </div>
    </div>
